name: Bootstrap (egyszeri)

# Egyszer futó segéd: a GitHub gépén lefuttatja a `flutter create`-et, ami legenerálja
# az Android platformfájlokat (android/), visszacommitolja őket erre az ágra,
# majd törli önmagát. A meglévő fájlokat (lib/, test/, pubspec.yaml, README) nem írja felül.
on:
  push:
    branches: [feature/projektvaz]

permissions:
  contents: write

jobs:
  flutter-create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter verzió
        id: ver
        run: |
          flutter --version
          echo "version=$(flutter --version --machine 2>/dev/null | jq -r .frameworkVersion)" >> "$GITHUB_OUTPUT"

      - name: Android platformfájlok generálása
        run: |
          if [ -d android ]; then echo "android/ már létezik – kihagyva"; exit 0; fi
          flutter create --org hu.relaycore --project-name pulzar --platforms android --no-pub .
          flutter pub get

      - name: Commit és push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/bootstrap.yml
          git add -A
          git status --short
          git commit -m "chore: flutter create – Android platformfájlok (Flutter ${{ steps.ver.outputs.version }})"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Ellenőrzés – flutter analyze
        run: flutter analyze

      - name: Ellenőrzés – flutter test
        run: flutter test
