name: CI

# Minden feltöltésnél: elemzés + tesztek és az aláírt APK fordítása PÁRHUZAMOSAN,
# majd – csak ha mindkettő sikeres – közzététel:
#  - ágra pusholva  → "Preview" előzetes kiadás (mindig a legutóbbi fordítás)
#  - v* címkére     → végleges GitHub Release a CHANGELOG megfelelő részével
# Részletek: docs/Döntések/ADR-006, ADR-009
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.6'

jobs:
  test:
    name: Elemzés és tesztek
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # A tárolási tesztekhez (sqflite_common_ffi) a gépen SQLite kell
      - run: sudo apt-get install -y libsqlite3-dev
      - run: flutter pub get
      # Hibák és figyelmeztetések megállítják a folyamatot, a stílusjavaslatok (info) csak megjelennek
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  apk:
    name: APK fordítása
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.name }}
      version_display: ${{ steps.version.outputs.display }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Verzió meghatározása
        id: version
        run: |
          BUILD_NUMBER=$(git rev-list --count HEAD)
          SHORT_SHA=$(git rev-parse --short HEAD)
          BASE=$(sed -nE 's/^version: *([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            NAME="${GITHUB_REF_NAME#v}"
            if [ "$NAME" != "$BASE" ]; then
              echo "::error::A címke ($GITHUB_REF_NAME) és a pubspec.yaml verziója ($BASE) eltér"
              exit 1
            fi
            DISPLAY="$NAME"
          else
            NAME="${BASE}-dev.${BUILD_NUMBER}"
            DISPLAY="$NAME ($SHORT_SHA, ${GITHUB_REF_NAME})"
          fi
          {
            echo "BUILD_NUMBER=$BUILD_NUMBER"
            echo "VERSION_NAME=$NAME"
            echo "VERSION_DISPLAY=$DISPLAY"
          } >> "$GITHUB_ENV"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "display=$DISPLAY" >> "$GITHUB_OUTPUT"
          echo "Verzió: $DISPLAY (build $BUILD_NUMBER)"

      - name: Aláíró kulcs előkészítése
        env:
          KEYSTORE_BASE64: ${{ secrets.PULZAR_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Hiányzik a PULZAR_KEYSTORE_BASE64 secret – lásd ADR-006"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pulzar-release.jks"
          echo "PULZAR_KEYSTORE_PATH=$RUNNER_TEMP/pulzar-release.jks" >> "$GITHUB_ENV"

      # Csak 64 bites ARM (minden mai telefon) – gyorsabb fordítás, ~harmad akkora APK (ADR-009)
      - name: APK fordítása
        env:
          PULZAR_KEYSTORE_PASSWORD: ${{ secrets.PULZAR_KEYSTORE_PASSWORD }}
          PULZAR_KEY_ALIAS: ${{ secrets.PULZAR_KEY_ALIAS }}
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --build-name "$VERSION_NAME" \
            --build-number "$BUILD_NUMBER" \
            --dart-define=APP_VERSION="$VERSION_DISPLAY"
          mv build/app/outputs/flutter-apk/app-release.apk "pulzar-${VERSION_NAME}.apk"
          rm -f "$PULZAR_KEYSTORE_PATH"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: pulzar-*.apk
          retention-days: 30

  publish:
    name: Közzététel
    needs: [test, apk]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION_NAME: ${{ needs.apk.outputs.version_name }}
      VERSION_DISPLAY: ${{ needs.apk.outputs.version_display }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk

      - name: Preview kiadás frissítése
        if: github.ref_type == 'branch'
        run: |
          gh release delete preview --yes --cleanup-tag 2>/dev/null || true
          gh release create preview pulzar-*.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Preview – ${VERSION_DISPLAY}" \
            --notes "Fejlesztői előnézet a(z) \`${GITHUB_REF_NAME}\` ág legutóbbi állapotából (${GITHUB_SHA:0:7}). Nem stabil kiadás – kipróbálásra."

      - name: Végleges kiadás
        if: github.ref_type == 'tag'
        run: |
          # A CHANGELOG adott verziójának szakasza, Obsidian-linkek nélkül
          awk -v v="$VERSION_NAME" '
            index($0, "## [" v "]") == 1 {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' docs/CHANGELOG.md \
            | sed -E 's/\[\[[^]|]*\|([^]]*)\]\]/\1/g; s/\[\[([^]|#]*)[^]]*\]\]/\1/g' > notes.md
          [ -s notes.md ] || echo "Lásd docs/CHANGELOG.md" > notes.md
          gh release create "$GITHUB_REF_NAME" pulzar-*.apk \
            --title "Pulzar ${VERSION_NAME}" \
            --notes-file notes.md \
            --verify-tag
